<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>All Transactions | Groww</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/user/balance/inr/transactions/styles.css">
<link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/favicon.png"><link rel="stylesheet" href="/responsive.css">

<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<script>if(localStorage.getItem("groww_demo_logged_in")!=="1"){location.replace("/index.html")}</script>

<header class="tx-header">
  <div class="tx-header-inner">
    <a class="tx-brand" href="/dashboard.html" aria-label="Groww"><img class="site-logo" src="/favicon.png" alt="Groww"></a>
    <nav class="tx-nav"><a class="active" href="/dashboard.html">Stocks</a><a href="#">F&amp;O</a><a href="#">Mutual Funds</a></nav>
    <div class="tx-spacer"></div>
    <div class="tx-search"><span>⌕</span><input id="search" placeholder="Search Groww...."><small>Ctrl+K</small></div>
    <button class="tx-bell" id="bell">♧</button>
    <button class="tx-avatar" id="profile">MS</button>
  </div>
</header>

<main class="tx-page">
  <div class="tx-title-row">
    <h1>All Transactions</h1>
    <button class="statement-btn" id="statementBtn"><span>⇩</span> Download statement</button>
  </div>

  <div class="tx-layout">
    <aside class="filters-card">
      <div class="filters-head">
        <h2>FILTERS</h2>
        <button id="clearFilters">CLEAR ALL</button>
      </div>

      <div class="filter-group">
        <h3>Transactions status</h3>
        <label class="check-row"><input type="checkbox" class="filter-check"> <span>Only failed</span></label>
      </div>

      <div class="filter-group">
        <h3>Transaction Type</h3>
        <label class="check-row"><input type="checkbox" class="filter-check"> <span>Deposit</span></label>
        <label class="check-row"><input type="checkbox" class="filter-check"> <span>Withdraw</span></label>
        <label class="check-row"><input type="checkbox" class="filter-check"> <span>Stocks</span></label>
        <label class="check-row"><input type="checkbox" class="filter-check"> <span>FnO</span></label>
        <label class="check-row"><input type="checkbox" class="filter-check"> <span>Others</span></label>
      </div>

      <div class="filter-group date-group">
        <h3>Date range</h3>
        <label class="date-input"><span>From</span><input id="fromDate" type="date"><b>▣</b></label>
        <label class="date-input"><span>To</span><input id="toDate" type="date"><b>▣</b></label>
      </div>
    </aside>

    <section class="transactions-results">
      <h2>Transactions</h2>
      <div class="transaction-list" id="transactionList"></div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var txKey="groww_demo_transactions";
  var pendingKey="groww_demo_pending_withdrawals";
  var listEl=document.getElementById("transactionList");
  var toastEl=document.getElementById("toast");
  var fromDate=document.getElementById("fromDate");
  var toDate=document.getElementById("toDate");
  var checks=[].slice.call(document.querySelectorAll(".filter-check"));
  var modal=document.getElementById("transactionModal");

  function toast(message){if(toastEl){toastEl.textContent=message;toastEl.classList.add("show");clearTimeout(window.__txToast);window.__txToast=setTimeout(function(){toastEl.classList.remove("show");},1800);}}
  function fmt(n){return Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function dateText(iso){return new Date(iso).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
  function load(){
    var data=[];
    try{data=JSON.parse(localStorage.getItem(txKey)||"[]");if(!Array.isArray(data))data=[];}catch(e){data=[];}
    var seeds=[
      {id:"seed1",type:"Deposit",title:"Add money",amount:15000,status:"Completed",date:"2026-09-03T09:15:00+05:30"},
      {id:"seed2",type:"Deposit",title:"Add money",amount:5000,status:"Completed",date:"2026-09-02T11:48:00+05:30"},
      {id:"seed3",type:"Deposit",title:"Add money",amount:15000,status:"Completed",date:"2026-09-01T13:36:00+05:30"},
      {id:"seed4",type:"Deposit",title:"Add money",amount:10000,status:"Completed",date:"2026-09-01T10:23:00+05:30"},
      {id:"seed5",type:"Deposit",title:"Add money",amount:10000,status:"Completed",date:"2026-08-31T13:17:00+05:30"},
      {id:"seed6",type:"Deposit",title:"Add money",amount:5000,status:"Completed",date:"2026-08-31T09:42:00+05:30"}
    ];
    var pending=[];
    try{pending=JSON.parse(localStorage.getItem(pendingKey)||"[]");if(!Array.isArray(pending))pending=[];}catch(e){pending=[];}
    pending.forEach(function(p,i){
      data.push({id:"pending-"+i+"-"+p.date,type:"Withdraw",title:"Withdraw",amount:Number(p.amount)||0,status:p.status||"Pending",date:p.date});
    });
    var combined=seeds.concat(data);
    var seen={};
    return combined.filter(function(item){
      var key=item.id || (item.type+"|"+item.amount+"|"+item.date);
      if(seen[key])return false;
      seen[key]=true;
      return true;
    });
  }
  function render(){
    var data=load().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    var selectedTypes=[];
    if(checks[1]?.checked)selectedTypes.push("Deposit");
    if(checks[2]?.checked)selectedTypes.push("Withdraw");
    if(checks[3]?.checked)selectedTypes.push("Stocks");
    if(checks[4]?.checked)selectedTypes.push("FnO");
    if(checks[5]?.checked)selectedTypes.push("Others");
    var failed=checks[0]?.checked;
    var from=fromDate?.value?new Date(fromDate.value+"T00:00:00"):null;
    var to=toDate?.value?new Date(toDate.value+"T23:59:59"):null;
    var filtered=data.filter(function(item){
      var d=new Date(item.date);
      if(failed && item.status!=="Failed")return false;
      if(selectedTypes.length && selectedTypes.indexOf(item.type)===-1)return false;
      if(from && d<from)return false;
      if(to && d>to)return false;
      return true;
    });
    listEl.innerHTML="";
    filtered.forEach(function(item){
      var row=document.createElement("button");
      row.type="button";
      row.className="transaction-row transaction-row-clickable "+(item.status==="Pending"?"pending-row":"");
      var positive=item.type==="Deposit";
      row.innerHTML='<span class="transaction-status '+(item.status==="Pending"?"pending":"success")+'">'+(item.status==="Pending"?"⏳":"✓")+'</span><div class="transaction-copy"><b>'+item.title+'</b><small>'+dateText(item.date)+(item.status==="Pending"?" · Pending":"")+'</small></div><strong>'+(positive?"+":"−")+'₹'+fmt(item.amount)+'</strong>';
      row.addEventListener("click",function(){openModal(item);});
      listEl.appendChild(row);
    });
    var empty=document.getElementById("noResults");
    if(!empty){empty=document.createElement("div");empty.id="noResults";empty.className="filtered-empty";empty.innerHTML='<div class="filtered-empty-icon">◌</div><h3>No transactions found</h3><p>Try changing or clearing the filters</p>';listEl.parentNode.appendChild(empty);}
    empty.style.display=filtered.length?"none":"block";
  }
  function openModal(item){
    document.getElementById("modalTitle").textContent=item.title;
    document.getElementById("modalDate").textContent=dateText(item.date);
    document.getElementById("modalAmount").textContent=(item.type==="Deposit"?"+":"−")+"₹"+fmt(item.amount);
    document.getElementById("modalState").textContent=item.status;
    document.getElementById("modalType").textContent=item.type;
    document.getElementById("modalStatus").textContent=item.status==="Pending"?"⏳":"✓";
    modal.classList.add("show");modal.setAttribute("aria-hidden","false");
  }
  function closeModal(){modal.classList.remove("show");modal.setAttribute("aria-hidden","true");}
  document.getElementById("transactionModalClose")?.addEventListener("click",closeModal);
  modal?.addEventListener("click",function(e){if(e.target===modal)closeModal();});
  document.getElementById("clearFilters")?.addEventListener("click",function(){
    checks.forEach(function(x){x.checked=false;});fromDate.value="";toDate.value="";render();toast("Filters cleared");
  });
  checks.forEach(function(x){x.addEventListener("change",function(){render();toast("Filter updated");});});
  fromDate?.addEventListener("change",function(){render();toast("Date range updated");});
  toDate?.addEventListener("change",function(){render();toast("Date range updated");});
  document.getElementById("statementBtn")?.addEventListener("click",function(){
    var rows=load().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    var text="Groww Demo - Transaction Statement\n\n"+rows.map(function(x){return dateText(x.date)+" | "+x.title+" | "+x.status+" | "+(x.type==="Deposit"?"+":"−")+"₹"+fmt(x.amount);}).join("\n");
    var blob=new Blob([text],{type:"text/plain"}), url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url;a.download="groww-transaction-statement.txt";a.click();URL.revokeObjectURL(url);toast("Statement downloaded");
  });
  document.getElementById("profile")?.addEventListener("click",function(){location.href="/dashboard.html";});
  document.getElementById("bell")?.addEventListener("click",function(){toast("No new notifications");});
  document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("search")?.focus();}if(e.key==="Escape")closeModal();});
  render();
})();
</script>
