<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Groww Balance | INR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/user/balance/inr/styles.css">
<link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/favicon.png"></head>
<body>
<script>if(localStorage.getItem("groww_demo_logged_in")!=="1"){location.replace("/index.html")}</script>

<header class="balance-header">
  <div class="balance-header-inner">
    <a class="balance-brand" href="/dashboard.html" aria-label="Groww"><img class="site-logo" src="/favicon.png" alt="Groww"></a>
    <nav class="balance-nav"><a class="active" href="/dashboard.html">Stocks</a><a href="#">F&amp;O</a><a href="#">Mutual Funds</a></nav>
    <div class="header-spacer"></div>
    <div class="balance-search"><span>⌕</span><input id="search" placeholder="Search Groww...."><small>Ctrl+K</small></div>
    <button class="balance-bell" id="bell">♧</button>
    <button class="balance-avatar" id="profile">MS</button>
  </div>
</header>

<main class="balance-page">
  <div class="balance-grid">
    <section class="left-col">
      <div class="summary-card">
        <div class="summary-head">
          <span>Stocks, F&amp;O balance</span>
          <strong>₹<b>39</b><sup>.80</sup></strong>
        </div>
        <div class="summary-body">
          <div class="cash-row">
            <span>Cash</span><button id="cashBtn">₹39.80 <i></i></button>
          </div>
          <div class="pledge-row">
            <span>Pledge</span><button id="pledgeBtn">Add <i></i></button>
            <p>Add balance for stocks intraday and F&amp;O by pledging your holdings on Groww</p>
          </div>
        </div>
      </div>

      <button class="transaction-link" id="transactionsBtn"><span>All transactions</span><b>›</b></button>

      <div class="instant-card">
        <div><strong>Instant trade balance</strong><p>Get ₹0 for Intraday, MTF &amp; FnO</p></div>
        <button id="instantBtn">Pledge</button>
      </div>
    </section>

    <section class="money-card">
      <div class="money-tabs">
        <button class="active" data-tab="add">Add money</button>
        <button data-tab="withdraw">Withdraw</button>
      </div>

      <div class="money-body">
        <div class="amount-display" id="amountDisplay">₹100</div>
        <input class="withdraw-input" id="withdrawInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter withdrawal amount" aria-label="Withdrawal amount">
        <div class="amount-chips">
          <button data-amount="100">+₹100</button>
          <button data-amount="5000">+₹5,000</button>
          <button data-amount="10000">+₹10,000</button>
        </div>
      </div>

      <button class="bank-pay" id="bankPay">
        <span class="upi-logo">◢</span>
        <span><b id="paymentTitle">Scan QR to pay</b><small>STATE BANK OF INDIA ••••4181</small></span>
        <b class="arrow">›</b>
      </button>
      <button class="add-money-btn" id="addMoneyBtn">Add money</button>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>
<script>
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1800)};
const balanceKey="groww_demo_cash_balance";
const balanceVersionKey="groww_demo_balance_version";
const withdrawalKey="groww_demo_pending_withdrawals";
const initialBalance=39.80;
const currentBalanceVersion="2";
let cashBalance=Number(localStorage.getItem(balanceKey));
if(localStorage.getItem(balanceVersionKey)!==currentBalanceVersion || !Number.isFinite(cashBalance) || cashBalance<0){
  cashBalance=initialBalance;
  localStorage.setItem(balanceKey,String(cashBalance));
  localStorage.setItem(balanceVersionKey,currentBalanceVersion);
}

const balanceValue=()=>cashBalance.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function syncBalanceUI(){
  document.querySelector(".summary-head strong").innerHTML="₹<b>"+Math.floor(cashBalance).toLocaleString("en-IN")+"</b><sup>."+String(Math.round((cashBalance%1)*100)).padStart(2,"0")+"</sup>";
  document.getElementById("cashBtn").innerHTML="₹"+balanceValue()+" <i></i>";
}
syncBalanceUI();

document.getElementById("profile").addEventListener("click",()=>location.href="/dashboard.html");
document.getElementById("bell").addEventListener("click",()=>toast("No new notifications"));
document.getElementById("transactionsBtn").addEventListener("click",()=>{location.href="/user/balance/inr/transactions"});
document.getElementById("cashBtn").addEventListener("click",()=>toast("Cash balance: ₹"+balanceValue()));
document.getElementById("pledgeBtn").addEventListener("click",()=>toast("Pledge flow opened"));
document.getElementById("instantBtn").addEventListener("click",()=>toast("Pledge flow opened"));
document.getElementById("bankPay").addEventListener("click",()=>toast(document.querySelector('.money-tabs button.active').dataset.tab==="withdraw"?"Withdrawal bank: SBI ••••4181":"Payment method: SBI ••••4181"));

const amountDisplay=document.getElementById("amountDisplay");
const withdrawInput=document.getElementById("withdrawInput");
const actionBtn=document.getElementById("addMoneyBtn");

function updateActionMode(isAdd){
  amountDisplay.style.display=isAdd?"block":"none";
  withdrawInput.style.display=isAdd?"none":"block";
  document.getElementById("paymentTitle").textContent=isAdd?"Scan QR to pay":"Withdraw to bank";
  actionBtn.textContent=isAdd?"Add money":"Withdraw";
}
document.querySelectorAll(".money-tabs button").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".money-tabs button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  const isAdd=btn.dataset.tab==="add";
  updateActionMode(isAdd);
  toast(isAdd?"Add money":"Withdraw");
}));
updateActionMode(true);

document.querySelectorAll(".amount-chips button").forEach(btn=>btn.addEventListener("click",()=>{
  const amount=Number(btn.dataset.amount);
  if(document.querySelector('.money-tabs button.active').dataset.tab==="withdraw"){
    withdrawInput.value=amount;
  }else{
    amountDisplay.textContent="₹"+amount.toLocaleString("en-IN");
  }
  toast("Amount selected");
}));

actionBtn.addEventListener("click",()=>{
  const isWithdraw=document.querySelector('.money-tabs button.active').dataset.tab==="withdraw";
  if(!isWithdraw){toast("Add money selected");return;}
  const amount=Number(withdrawInput.value || 5000);
  if(!Number.isFinite(amount) || amount<=0){toast("Enter a valid withdrawal amount");return;}
  if(amount>cashBalance+0.0001){toast("Insufficient balance. Available ₹"+balanceValue());return;}
  cashBalance=Number((cashBalance-amount).toFixed(2));
  localStorage.setItem(balanceKey,String(cashBalance));
  const pending=JSON.parse(localStorage.getItem(withdrawalKey)||"[]");
  pending.unshift({amount,date:new Date().toISOString(),status:"Pending"});
  localStorage.setItem(withdrawalKey,JSON.stringify(pending));
  syncBalanceUI();
  toast("₹"+amount.toLocaleString("en-IN",{minimumFractionDigits:2})+" withdrawal requested. It should be credited within 15–20 working days.");
  withdrawInput.value="";
});

document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("search").focus()}});
</script>
</body>
</html>
