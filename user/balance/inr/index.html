<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Groww Balance | INR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/user/balance/inr/styles.css">
<link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/favicon.png"><link rel="stylesheet" href="/responsive.css">

<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<script>if(localStorage.getItem("groww_demo_logged_in")!=="1"){location.replace("/index.html")}</script>

<header class="balance-header">
  <div class="balance-header-inner">
    <a class="balance-brand" href="/dashboard.html" aria-label="Groww"><img class="site-logo" src="/favicon.png" alt="Groww"></a>
    <nav class="balance-nav"><a class="active" href="/dashboard.html">Stocks</a><a href="#">F&amp;O</a><a href="#">Mutual Funds</a></nav>
    <div class="header-spacer"></div>
    <div class="balance-search"><span>⌕</span><input id="search" placeholder="Search Groww...."><small>Ctrl+K</small></div>
    <button class="balance-bell" id="bell">♧</button>
    <button class="balance-avatar" id="profile">MS</button>
  </div>
</header>

<main class="balance-page">
  <div class="balance-grid">
    <section class="left-col">
      <div class="summary-card">
        <div class="summary-head">
          <span>Stocks, F&amp;O balance</span>
          <strong>₹<b>39</b><sup>.80</sup></strong>
        </div>
        <div class="summary-body">
          <div class="cash-row">
            <span>Cash</span><button id="cashBtn">₹39.80 <i></i></button>
          </div>
          <div class="pledge-row">
            <span>Pledge</span><button id="pledgeBtn">Add <i></i></button>
            <p>Add balance for stocks intraday and F&amp;O by pledging your holdings on Groww</p>
          </div>
        </div>
      </div>

      <button class="transaction-link" id="transactionsBtn"><span>All transactions</span><b>›</b></button>

      <div class="instant-card">
        <div><strong>Instant trade balance</strong><p>Get ₹0 for Intraday, MTF &amp; FnO</p></div>
        <button id="instantBtn">Pledge</button>
      </div>
    </section>

    <section class="money-card">
      <div class="money-tabs">
        <button type="button" class="active" data-tab="add">Add money</button>
        <button type="button" data-tab="withdraw">Withdraw</button>
      </div>

      <div class="money-body">
        <div class="amount-display" id="amountDisplay">₹100</div>
        <input class="withdraw-input" id="withdrawInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter withdrawal amount" aria-label="Withdrawal amount">
        <div class="amount-chips">
          <button type="button" data-amount="100">+₹100</button>
          <button type="button" data-amount="5000">+₹5,000</button>
          <button type="button" data-amount="10000">+₹10,000</button>
        </div>
      </div>

      <button type="button" class="bank-pay" id="bankPay">
        <span class="upi-logo">◢</span>
        <span><b id="paymentTitle">Scan QR to pay</b><small>STATE BANK OF INDIA ••••4181</small></span>
        <b class="arrow">›</b>
      </button>
      <button type="button" class="add-money-btn" id="addMoneyBtn">Add money</button>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="alert" aria-live="assertive"><span id="toastMessage"></span><button class="toast-close" id="toastClose" type="button" aria-label="Close notification">×</button></div>
<script>
(function () {
  "use strict";

  var toastEl = document.getElementById("toast");
  var toastMessage = document.getElementById("toastMessage");
  var closeBtn = document.getElementById("toastClose");

  function toast(message) {
    if (!toastEl || !toastMessage) return;
    toastMessage.textContent = String(message);
    toastEl.classList.add("show");
  }

  function closeToast() {
    if (toastEl) toastEl.classList.remove("show");
  }

  if (closeBtn) closeBtn.addEventListener("click", closeToast);

  var balanceKey = "groww_demo_cash_balance";
  var balanceVersionKey = "groww_demo_balance_version";
  var withdrawalKey = "groww_demo_pending_withdrawals";
  var initialBalance = 39.80;
  var currentBalanceVersion = "4";

  var storedBalance = Number(localStorage.getItem(balanceKey));
  var storedVersion = localStorage.getItem(balanceVersionKey);

  if (storedVersion !== currentBalanceVersion || !Number.isFinite(storedBalance) || storedBalance < 0) {
    storedBalance = initialBalance;
    localStorage.setItem(balanceKey, String(storedBalance));
    localStorage.setItem(balanceVersionKey, currentBalanceVersion);
  }

  var cashBalance = storedBalance;

  function balanceValue() {
    return cashBalance.toLocaleString("en-IN", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function syncBalanceUI() {
    var summary = document.querySelector(".summary-head strong");
    var cash = document.getElementById("cashBtn");

    if (summary) {
      var whole = Math.floor(cashBalance).toLocaleString("en-IN");
      var paise = String(Math.round((cashBalance % 1) * 100)).padStart(2, "0");
      summary.innerHTML = "₹<b>" + whole + "</b><sup>." + paise + "</sup>";
    }

    if (cash) cash.innerHTML = "₹" + balanceValue() + " <i></i>";
  }

  function isWithdrawMode() {
    var active = document.querySelector(".money-tabs button.active");
    return !!active && active.getAttribute("data-tab") === "withdraw";
  }

  function updateActionMode(isAdd) {
    var amountDisplay = document.getElementById("amountDisplay");
    var withdrawInput = document.getElementById("withdrawInput");
    var paymentTitle = document.getElementById("paymentTitle");
    var actionBtn = document.getElementById("addMoneyBtn");

    if (amountDisplay) amountDisplay.style.display = isAdd ? "block" : "none";
    if (withdrawInput) withdrawInput.style.display = isAdd ? "none" : "block";
    if (paymentTitle) paymentTitle.textContent = isAdd ? "Scan QR to pay" : "Withdraw to bank";
    if (actionBtn) actionBtn.textContent = isAdd ? "Add money" : "Withdraw";
  }

  document.addEventListener("click", function (event) {
    var target = event.target;

    var tab = target.closest ? target.closest(".money-tabs button") : null;
    if (tab) {
      event.preventDefault();

      var tabs = document.querySelectorAll(".money-tabs button");
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
      tab.classList.add("active");

      updateActionMode(tab.getAttribute("data-tab") !== "withdraw");
      closeToast();
      return;
    }

    var chip = target.closest ? target.closest(".amount-chips button") : null;
    if (chip) {
      event.preventDefault();

      var amount = Number(chip.getAttribute("data-amount") || 0);
      if (!Number.isFinite(amount)) return;

      if (isWithdrawMode()) {
        var input = document.getElementById("withdrawInput");
        if (input) {
          input.value = String(amount);
          input.focus();
        }
      } else {
        var display = document.getElementById("amountDisplay");
        if (display) display.textContent = "₹" + amount.toLocaleString("en-IN");
      }
      return;
    }

    var action = target.closest ? target.closest("#addMoneyBtn") : null;
    if (action) {
      event.preventDefault();

      if (!isWithdrawMode()) {
        toast("Add money selected");
        return;
      }

      var withdrawInput = document.getElementById("withdrawInput");
      var amount = Number(withdrawInput && withdrawInput.value ? withdrawInput.value : 0);

      if (!Number.isFinite(amount) || amount <= 0) {
        toast("Enter a valid withdrawal amount");
        return;
      }

      if (amount > cashBalance + 0.0001) {
        toast("Insufficient balance. Available ₹" + balanceValue());
        return;
      }

      cashBalance = Number((cashBalance - amount).toFixed(2));
      localStorage.setItem(balanceKey, String(cashBalance));

      var pending = [];
      try {
        pending = JSON.parse(localStorage.getItem(withdrawalKey) || "[]");
        if (!Array.isArray(pending)) pending = [];
      } catch (e) {
        pending = [];
      }

      pending.unshift({
        amount: amount,
        date: new Date().toISOString(),
        status: "Pending"
      });

      localStorage.setItem(withdrawalKey, JSON.stringify(pending));
      syncBalanceUI();
      toast("₹" + amount.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " withdrawal requested.");

      if (withdrawInput) withdrawInput.value = "";
      return;
    }

    var bank = target.closest ? target.closest("#bankPay") : null;
    if (bank) {
      event.preventDefault();
      toast(isWithdrawMode() ? "Withdrawal bank: SBI ••••4181" : "Payment method: SBI ••••4181");
      return;
    }

    var transactions = target.closest ? target.closest("#transactionsBtn") : null;
    if (transactions) {
      location.href = "/user/balance/inr/transactions/";
      return;
    }

    var profile = target.closest ? target.closest("#profile") : null;
    if (profile) {
      location.href = "/dashboard.html";
      return;
    }
  });

  document.getElementById("bell")?.addEventListener("click", function () {
    toast("No new notifications");
  });

  document.getElementById("cashBtn")?.addEventListener("click", function () {
    toast("Cash balance: ₹" + balanceValue());
  });

  document.getElementById("pledgeBtn")?.addEventListener("click", function () {
    toast("Pledge flow opened");
  });

  document.getElementById("instantBtn")?.addEventListener("click", function () {
    toast("Pledge flow opened");
  });

  document.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      var search = document.getElementById("search");
      if (search) search.focus();
    }
  });

  syncBalanceUI();
  updateActionMode(false);
  updateActionMode(document.querySelector(".money-tabs button.active")?.getAttribute("data-tab") !== "withdraw");
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script>
</body>
</html>
