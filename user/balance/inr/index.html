<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Groww Balance | INR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/user/balance/inr/styles.css">
<link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/favicon.png"><link rel="stylesheet" href="/responsive.css">

<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<script>if(localStorage.getItem("groww_demo_logged_in")!=="1"){location.replace("/index.html")}</script>

<header class="balance-header">
  <div class="balance-header-inner">
    <a class="balance-brand" href="/dashboard.html" aria-label="Groww"><img class="site-logo" src="/favicon.png" alt="Groww"></a>
    <nav class="balance-nav"><a class="active" href="/dashboard.html">Stocks</a><a href="#">F&amp;O</a><a href="#">Mutual Funds</a></nav>
    <div class="header-spacer"></div>
    <div class="balance-search"><span>⌕</span><input id="search" placeholder="Search Groww...."><small>Ctrl+K</small></div>
    <button class="balance-bell" id="bell">♧</button>
    <button class="balance-avatar" id="profile">MS</button>
  </div>
</header>

<main class="balance-page">
  <div class="balance-grid">
    <section class="left-col">
      <div class="summary-card">
        <div class="summary-head">
          <span>Stocks, F&amp;O balance</span>
          <strong>₹<b>39</b><sup>.80</sup></strong>
        </div>
        <div class="summary-body">
          <div class="cash-row">
            <span>Cash</span><button id="cashBtn">₹39.80 <i></i></button>
          </div>
          <div class="pledge-row">
            <span>Pledge</span><button id="pledgeBtn">Add <i></i></button>
            <p>Add balance for stocks intraday and F&amp;O by pledging your holdings on Groww</p>
          </div>
        </div>
      </div>

      <button class="transaction-link" id="transactionsBtn"><span>All transactions</span><b>›</b></button>

      <div class="instant-card">
        <div><strong>Instant trade balance</strong><p>Get ₹0 for Intraday, MTF &amp; FnO</p></div>
        <button id="instantBtn">Pledge</button>
      </div>
    </section>

    <section class="money-card">
      <div class="money-tabs">
        <button type="button" class="active" data-tab="add" onclick="window.balanceSwitchTab('add')">Add money</button>
        <button type="button" data-tab="withdraw" onclick="window.balanceSwitchTab('withdraw')">Withdraw</button>
      </div>

      <div class="money-body">
        <input class="amount-display" id="amountDisplay" type="number" min="1" step="0.01" inputmode="decimal" value="100" aria-label="Custom money amount">
        <input class="withdraw-input" id="withdrawInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter withdrawal amount" aria-label="Withdrawal amount">
        <div class="amount-chips">
          <button type="button" data-amount="100" onclick="window.balanceSetAmount(100)">+₹100</button>
          <button type="button" data-amount="5000" onclick="window.balanceSetAmount(5000)">+₹5,000</button>
          <button type="button" data-amount="10000" onclick="window.balanceSetAmount(10000)">+₹10,000</button>
        </div>
      </div>

      <button type="button" class="bank-pay" id="bankPay">
        <span class="upi-logo">◢</span>
        <span><b id="paymentTitle">Scan QR to pay</b><small>STATE BANK OF INDIA ••••4181</small></span>
        <b class="arrow">›</b>
      </button>
      <button type="button" class="add-money-btn" id="addMoneyBtn" onclick="window.balanceAction()">Add money</button>
    </section>
  </div>
</main><script>
(function(){
  "use strict";
  var balanceKey="groww_demo_cash_balance";
  var withdrawalKey="groww_demo_pending_withdrawals";
  var initialBalance=39.80;

  function el(id){ return document.getElementById(id); }
  function show(message){
    var t=el("toast"), m=el("toastMessage");
    if(m) m.textContent=message;
    if(t) t.classList.add("show");
  }
  function hide(){
    var t=el("toast");
    if(t) t.classList.remove("show");
  }
  function isWithdraw(){
    var active=document.querySelector(".money-tabs button.active");
    return active && active.getAttribute("data-tab")==="withdraw";
  }
  function setMode(mode){
    var add=mode!=="withdraw";
    document.querySelectorAll(".money-tabs button").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-tab")===mode);
    });
    var display=el("amountDisplay"), input=el("withdrawInput"), title=el("paymentTitle"), button=el("addMoneyBtn");
    if(display) display.style.display=add?"block":"none";
    if(input) input.style.display=add?"none":"block";
    if(title) title.textContent=add?"Scan QR to pay":"Withdraw to bank";
    if(button) button.textContent=add?"Add money":"Withdraw";
    hide();
  }
  function setAmount(amount){
    if(isWithdraw()){
      var input=el("withdrawInput");
      if(input){input.value=String(amount);input.focus();}
    }else{
      var display=el("amountDisplay");
      if(display) display.textContent="₹"+Number(amount).toLocaleString("en-IN");
    }
  }
  function balance(){
    var n=Number(localStorage.getItem(balanceKey));
    return Number.isFinite(n)&&n>=0?n:initialBalance;
  }
  function action(){
    if(!isWithdraw()){show("Add money selected");return;}
    var input=el("withdrawInput"), amount=Number(input&&input.value||0), bal=balance();
    if(!Number.isFinite(amount)||amount<=0){show("Enter a valid withdrawal amount");return;}
    if(amount>bal+0.0001){show("Insufficient balance. Available ₹"+bal.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}));return;}
    bal=Number((bal-amount).toFixed(2));
    localStorage.setItem(balanceKey,String(bal));
    var list=[]; try{list=JSON.parse(localStorage.getItem(withdrawalKey)||"[]");}catch(e){list=[];}
    if(!Array.isArray(list)) list=[];
    list.unshift({amount:amount,date:new Date().toISOString(),status:"Pending"});
    localStorage.setItem(withdrawalKey,JSON.stringify(list));
    show("₹"+amount.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})+" withdrawal requested.");
    if(input) input.value="";
  }

  window.balanceSwitchTab=setMode;
  window.balanceSetAmount=setAmount;
  window.balanceAction=action;
  window.balanceCloseToast=hide;

  document.addEventListener("click",function(e){
    var target=e.target;
    var tab=target.closest&&target.closest(".money-tabs button");
    if(tab){e.preventDefault();setMode(tab.getAttribute("data-tab"));return;}
    var chip=target.closest&&target.closest(".amount-chips button");
    if(chip){e.preventDefault();setAmount(Number(chip.getAttribute("data-amount")));return;}
    if(target.closest&&target.closest("#addMoneyBtn")){e.preventDefault();action();return;}
    if(target.closest&&target.closest("#bankPay")){e.preventDefault();show(isWithdraw()?"Withdrawal bank: SBI ••••4181":"Payment method: SBI ••••4181");return;}
    if(target.closest&&target.closest("#cashBtn")){e.preventDefault();show("Cash balance: ₹"+balance().toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}));return;}
    if(target.closest&&target.closest("#pledgeBtn")){e.preventDefault();show("Pledge flow opened");return;}
    if(target.closest&&target.closest("#instantBtn")){e.preventDefault();show("Pledge flow opened");return;}
  });

  document.addEventListener("DOMContentLoaded",function(){
    var close=el("toastClose");
    if(close) close.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();hide();});
    setMode("add");
  });
})();
</script>
<div class="toast" id="toast" role="alert" aria-live="assertive"><span id="toastMessage"></span><button class="toast-close" id="toastClose" type="button" aria-label="Close notification" onclick="window.balanceCloseToast()">×</button></div>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}</script>
</body>
</html>
