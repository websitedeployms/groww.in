<div class="toast" id="toast"></div>
<script>
const toast=(m)=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),1700)};
document.getElementById("profileBtn").addEventListener("click",()=>location.href="/dashboard.html");
document.querySelectorAll(".report-row").forEach(btn=>btn.addEventListener("click",()=>toast("Report selected")));
document.querySelectorAll(".profile-link").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".profile-link").forEach(x=>x.classList.remove("active"));btn.classList.add("active");toast(btn.textContent.replace("›","").trim())}));
document.querySelector(".need-help").addEventListener("click",()=>toast("Help opened"));
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim())toast("Search: "+e.target.value.trim())});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("search").focus()}});
</script>
