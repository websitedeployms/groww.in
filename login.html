<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00b386">
<title>Login / Sign up · Groww Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./login.css">
<link rel="stylesheet" href="/responsive.css">
</head>
<body>
<script>
  if (localStorage.getItem("groww_demo_logged_in") === "1") location.replace("./dashboard.html");
</script>

<div class="login-page">
  <header class="login-header">
    <a href="./index.html" class="brand" aria-label="Groww">
      <span class="groww-mark"><i></i><i></i><i></i></span>
      <span class="brand-name">Groww</span>
    </a>
  </header>

  <main class="login-main">
    <div class="login-intro">
      <span class="intro-kicker">WELCOME TO GROWW</span>
      <h1>Grow your wealth.</h1>
      <p>Login or sign up to start investing in stocks, mutual funds and more.</p>
    </div>

    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-icon"><span class="groww-mark small"><i></i><i></i><i></i></span></div>
      <h2 id="loginTitle">Login / Sign up</h2>
      <p class="subtitle">Enter your mobile number to continue</p>

      <form id="loginForm" novalidate>
        <label for="mobile">Mobile number</label>
        <div class="phone-field">
          <span>+91</span>
          <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="Enter mobile number">
        </div>
        <div class="field-error" id="fieldError"></div>
        <button class="continue-btn" type="submit">Continue</button>
      </form>

      <div class="or"><span>or</span></div>

      <button class="google-btn" id="googleBtn" type="button">
        <span class="google-g">G</span>
        Continue with Google
      </button>

      <p class="terms">By continuing, you agree to Groww's <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>.</p>
    </section>

    <div class="secure-note"><span class="shield">✓</span> Your information is encrypted and secure</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const form=document.getElementById("loginForm");
const mobile=document.getElementById("mobile");
const error=document.getElementById("fieldError");
const toast=document.getElementById("toast");
const showToast=(m)=>{toast.textContent=m;toast.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove("show"),2100)};
mobile.addEventListener("input",()=>{mobile.value=mobile.value.replace(/\D/g,"").slice(0,10);error.textContent=""});
form.addEventListener("submit",(e)=>{
  e.preventDefault();
  const value=mobile.value.replace(/\D/g,"");
  if(value.length!==10){error.textContent="Enter a valid 10-digit mobile number";mobile.focus();return}
  error.textContent="";
  localStorage.setItem("groww_demo_logged_in","1");
  localStorage.setItem("groww_demo_mobile",value);
  showToast("Login successful");
  setTimeout(()=>location.replace("./dashboard.html"),450);
});
document.getElementById("googleBtn").addEventListener("click",()=>{
  localStorage.setItem("groww_demo_logged_in","1");
  localStorage.setItem("groww_demo_provider","google");
  showToast("Google demo login successful");
  setTimeout(()=>location.replace("./dashboard.html"),450);
});
</script>
</body>
</html>
