<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groww · Home Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./dashboard.css">
</head>
<body>
<script>(function(){if(localStorage.getItem("groww_demo_logged_in")!=="1"){location.replace("./index.html");}})();</script>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="#"><span class="mark"><i></i><i></i><i></i></span><span>Groww</span></a>
    <nav class="top-nav">
      <a class="active" href="#">Stocks</a>
      <a href="#">F&amp;O</a>
      <a href="#">Mutual Funds</a>
    </nav>
    <span class="nav-divider"></span>
    <a class="more" href="#">More</a>
    <div class="header-spacer"></div>
    <div class="searchbox">
      <span class="search-icon">⌕</span>
      <input id="searchInput" placeholder="Search Groww...." aria-label="Search Groww">
      <span>Ctrl+K</span>
    </div>
    <button class="account" id="accountBtn">MS</button>
  </div>
</header>

<main class="home">
  <div class="market-strip">
    <div class="markets">
      <div class="market positive"><b>17%</b></div>
      <div class="market"><strong>NIFTYSMALL</strong><span>19,351.10</span><em>↓ 1.85%</em></div>
      <div class="market"><strong>NIFTYMIDCAP</strong><span>59,914.20</span><em>↓ 1.63%</em></div>
      <div class="market"><strong>NIFTYJR</strong><span>70,309.50</span><em>↓ 2.00%</em></div>
      <div class="market"><strong>NIFTYMIDSELECT</strong><span>13,776.35</span><em>↓ 1.79%</em></div>
      <div class="market"><strong>NIFTYPHARMA</strong><span>26,761.65</span><em>↓ 0.89%</em></div>
      <div class="market"><strong>NIFTY50</strong><span>24,038.05</span></div>
    </div>
  </div>

  <section class="hero">
    <h1>Groww your wealth</h1>
    <button class="get-started" id="exploreBtn">Get started</button>
    <div class="hero-art-wrap">
      <img src="./image.png" alt="Groww investment illustration" class="hero-art">
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script>
const toast=(m)=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)};
document.getElementById("exploreBtn")?.addEventListener("click",()=>toast("You're already logged in — welcome to Groww"));
document.getElementById("searchInput")?.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && e.currentTarget.value.trim()) toast("Searching for "+e.currentTarget.value.trim());
});
document.addEventListener("keydown",(e)=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("searchInput")?.focus()}
});
document.getElementById("accountBtn")?.addEventListener("click",()=>{
  if(confirm("Log out of the demo account?")){localStorage.removeItem("groww_demo_logged_in");location.replace("./index.html")}
});
</script>
</body>
</html>
